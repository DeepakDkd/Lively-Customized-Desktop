  <style>
    /* Strictly transparent base */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f1f5f9;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Background Video Layer */
    .video-background-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    #bgVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.5s ease;
    }

    #videoDimmer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.15);
      pointer-events: none;
      display: block;
    }

    /* Screen container */
    .widget-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      /* Let desktop clicks pass through */
    }

    /* Modern Dark-Translucent Floating Card */
    .quote-card {
      pointer-events: auto;
      /* Enable interaction on the card */
      position: absolute;
      bottom: 48px;
      right: 48px;
      width: clamp(340px, 28vw, 520px);
      background: rgba(13, 13, 17, 0.65);
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 157, 0, 0.28);
      border-radius: 18px;
      padding: 24px 28px 20px;
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.55),
        0 0 35px rgba(255, 157, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      cursor: grab;
    }

    .quote-card:active {
      cursor: grabbing;
    }

    .quote-card:hover {
      border-color: rgba(255, 157, 0, 0.38);
      box-shadow:
        0 24px 55px rgba(0, 0, 0, 0.65),
        0 0 45px rgba(255, 157, 0, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    /* Header & Controls */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      opacity: 0.85;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #94a3b8;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 6px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .status-badge:hover {
      background: rgba(255, 255, 255, 0.07);
      color: #e2e8f0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .status-dot.offline {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }

    .status-dot.loading {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
        transform: scale(0.85);
      }

      100% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .mode-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 6px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-select:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 157, 0, 0.4);
      color: #fff;
    }

    .mode-select option {
      background: #121217;
      color: #f1f5f9;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      position: relative;
    }

    .icon-btn:hover {
      background: rgba(255, 157, 0, 0.15);
      border-color: rgba(255, 157, 0, 0.4);
      color: #ff9d00;
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.4s ease;
    }

    .icon-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    #videoFileInput {
      display: none;
    }

    /* Content Area with Fade Transitions */
    .quote-body {
      position: relative;
      min-height: 80px;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      transform: translateY(0);
    }

    .quote-body.fade-out {
      opacity: 0;
      transform: translateY(8px);
    }

    .quote-mark {
      position: absolute;
      top: -8px;
      left: -14px;
      font-size: 3.2rem;
      line-height: 1;
      font-family: 'Playfair Display', Georgia, serif;
      color: rgba(255, 157, 0, 0.18);
      pointer-events: none;
    }

    .quote-text {
      position: relative;
      z-index: 1;
      font-size: 1.25rem;
      line-height: 1.58;
      font-weight: 500;
      color: var(--accent-color, #ff9d00);
      text-shadow: 0 0 20px rgba(255, 157, 0, 0.25);
      margin-bottom: 18px;
      word-break: break-word;
    }

    .attribution {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      text-align: right;
      gap: 5px;
    }

    .character-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      letter-spacing: 0.02em;
    }

    .anime-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .anime-title {
      font-size: 0.82rem;
      font-style: italic;
      color: #94a3b8;
      letter-spacing: 0.01em;
    }

    .genre-pill {
      font-size: 0.62rem;

      border: 1px solid rgba(255, 157, 0, 0.3);
      color: var(--accent-color, #ff9d00);
      white-space: nowrap;
      transition: all 0.3s ease;

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;

      font-weight: 600;
      color: #ff9d00;
      pointer-events: none;

    @media (max-width: 640px) {

        right: 20px;
        left: 20px;
        width: auto;
      }

      .quote-text {

      }
    }
  </style>
</head>

      function openDB() {

          req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });

          await new Promise(r => tx.oncomplete = r);
        } catch (e) {
          console.warn('Failed to store video in IndexedDB:', e);

            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
          });

            setVideoSource(URL.createObjectURL(file));
            return true;

      async function getAnimeGenres(animeTitle) {
        if (!animeTitle || animeTitle === 'Unknown') return [];
        const cleanTitle = animeTitle.replace(/\s*\([^)]*\)/g, '').trim();
        if (animeGenreCache[cleanTitle]) {
          return animeGenreCache[cleanTitle];
        }

        try {
          const query = `
            query ($search: String) {
              Media(search: $search, type: ANIME) {
                genres
                tags {
                  name
                }
              }
            }
          `;
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3500);
          const res = await fetch('https://graphql.anilist.co', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ query, variables: { search: cleanTitle } }),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const json = await res.json();
            const media = json.data?.Media;
            const genres = media?.genres || [];
            const tags = (media?.tags || []).map(t => t.name);
            const combined = [...new Set([...genres, ...tags])];
            if (combined.length > 0) {
              animeGenreCache[cleanTitle] = combined;
              try {
                localStorage.setItem('anilist_genre_cache_v1', JSON.stringify(animeGenreCache));
              } catch (e) {}
              return combined;
            }
          }
        } catch (e) {
          console.warn('[AniList] Genre lookup failed for:', cleanTitle, e.message);
        }

        return [];
      }

      function matchesGenre(itemGenres, targetGenre) {
        if (!targetGenre || targetGenre === 'all') return true;
        const lowerGenres = (itemGenres || []).map(g => (g || '').toLowerCase());

        switch (targetGenre) {
          case 'action':
            return lowerGenres.some(g => ['action', 'adventure', 'shounen', 'shonen', 'martial arts', 'super power'].includes(g));
          case 'ecchi':
            return lowerGenres.some(g => ['ecchi', 'harem', 'female harem', 'nudity'].includes(g));
          case 'romance':
            return lowerGenres.some(g => ['romance', 'drama', 'slice of life'].includes(g));
          case 'comedy':
            return lowerGenres.some(g => ['comedy', 'parody', 'slapstick'].includes(g));
          case 'psychological':
            return lowerGenres.some(g => ['psychological', 'sci-fi', 'thriller', 'mystery', 'mecha'].includes(g));
          case 'fantasy':
            return lowerGenres.some(g => ['fantasy', 'supernatural', 'magic', 'demons', 'isekai'].includes(g));
          default:
            return true;
        }
      }

       * - All 801 quotes from AniQuotesAPI (Naruto, AoT, One Piece, Dragon Ball, Solo Leveling, Your Name, 86, Frieren)
       * - Curated quotes across all genres (Ecchi, Romance, Comedy, Psychological, Fantasy, Action)
       * - When mode is a specific genre, accurately filters quotes matching that genre
       */
      function pickQuoteFromDatabase(mode) {
        const targetMode = mode || 'all';
        let candidatePool = [];

        // 1. Quotes from AniQuotesAPI database (801 quotes from quotes.json)
        if (aniQuotesDatabase && aniQuotesDatabase.length > 0) {
          const matchingAniQuotes = aniQuotesDatabase.filter(cand => {
            const genres = animeGenreCache[cand.anime] || [];
            return matchesGenre(genres, targetMode);
          });
          candidatePool.push(...matchingAniQuotes);
        }

        // 2. Curated quotes for the target genre or all genres
        if (targetMode === 'all') {
          // Flatten all curated genres so every type is represented
          const allCurated = Object.values(CURATED_QUOTES).flat();
          candidatePool.push(...allCurated);
        } else if (CURATED_QUOTES[targetMode]) {
          candidatePool.push(...CURATED_QUOTES[targetMode]);
        }

        if (candidatePool.length === 0) {
          candidatePool = CURATED_QUOTES.action;
        }

        // Filter out recently shown quotes to prevent quick repeats
        let eligible = candidatePool.filter(c => !recentQuoteKeys.includes(c.quote));
        if (eligible.length === 0) {
          recentQuoteKeys.length = 0; // Reset history if all shown
          eligible = candidatePool;
        }

        // In 'all' mode: diversify across anime / types instead of clustering on a single anime
        let picked;
        if (targetMode === 'all') {
          // 40% chance: pick from curated multi-genre pool (guarantees Ecchi, Romance, Comedy, Psych are seen)
          // 60% chance: pick from AniQuotesAPI pool (Naruto, AoT, One Piece, DBZ, Solo Leveling, Your Name, 86, Frieren)
          const allCurated = Object.values(CURATED_QUOTES).flat();
          const shouldPickCurated = Math.random() < 0.4;
          if (shouldPickCurated && allCurated.length > 0) {
            const curatedEligible = allCurated.filter(c => !recentQuoteKeys.includes(c.quote));
            const poolToUse = curatedEligible.length > 0 ? curatedEligible : allCurated;
            picked = poolToUse[Math.floor(Math.random() * poolToUse.length)];
          } else {
            picked = eligible[Math.floor(Math.random() * eligible.length)];
          }
        } else {
          // If this genre has curated quotes, give a balanced 50/50 chance between curated quotes and matching AniQuotes
          const curatedForMode = CURATED_QUOTES[targetMode] || [];
          const matchingAniQuotes = (aniQuotesDatabase || []).filter(cand => {
            const genres = animeGenreCache[cand.anime] || [];
            return matchesGenre(genres, targetMode);
          });

          if (curatedForMode.length > 0 && matchingAniQuotes.length > 0) {
            const shouldPickCurated = Math.random() < 0.5;
            if (shouldPickCurated) {
              const eligibleCurated = curatedForMode.filter(c => !recentQuoteKeys.includes(c.quote));
              const pool = eligibleCurated.length > 0 ? eligibleCurated : curatedForMode;
              picked = pool[Math.floor(Math.random() * pool.length)];
            } else {
              const eligibleAni = matchingAniQuotes.filter(c => !recentQuoteKeys.includes(c.quote));
              const pool = eligibleAni.length > 0 ? eligibleAni : matchingAniQuotes;
              picked = pool[Math.floor(Math.random() * pool.length)];
            }
          } else {
            picked = eligible[Math.floor(Math.random() * eligible.length)];
          }
        }

        // Track recently shown
        if (picked && picked.quote) {
          recentQuoteKeys.push(picked.quote);
          if (recentQuoteKeys.length > 30) {
            recentQuoteKeys.shift();
          }
        }

        const genres = picked.genres || animeGenreCache[picked.anime] || [];
        return {
          quote: picked.quote,
          character: picked.character || 'Unknown',
          anime: picked.anime || 'Unknown',
          genres
        };
      }

      function getFallbackQuote(mode) {
        return pickQuoteFromDatabase(mode);
      }

      function updateQuoteDisplay(data, isOnline = true, genres = []) {
        if (!data) return;
        quoteBody.classList.add('fade-out');

        setTimeout(() => {
          quoteTextEl.textContent = `“${data.quote}”`;
          characterNameEl.textContent = `— ${data.character}`;
          animeTitleEl.textContent = data.anime;

          // Display detected genres in pill
          if (genrePillEl) {
            const displayGenres = (genres || []).filter(g =>
              ['Action', 'Adventure', 'Comedy', 'Drama', 'Ecchi', 'Fantasy', 'Horror', 'Mecha', 'Mystery', 'Psychological', 'Romance', 'Sci-Fi', 'Slice of Life', 'Supernatural', 'Thriller', 'Harem', 'Shounen'].includes(g)
            ).slice(0, 2);

            if (displayGenres.length > 0) {
              genrePillEl.textContent = displayGenres.join(' • ');
              genrePillEl.style.display = 'inline-block';
            } else {
              genrePillEl.style.display = 'none';
            }
          }

          statusDotEl.className = 'status-dot' + (isOnline ? '' : ' offline');
          statusDotEl.title = isOnline
            ? `${statusLabelEl.textContent.trim()} (Online • Connected)`
            : `${statusLabelEl.textContent.trim()} (Offline • Auto-reconnecting...)`;

          quoteBody.classList.remove('fade-out');
        }, 300);
      }

      function scheduleRetry() {
        if (retryTimeout) clearTimeout(retryTimeout);
        const delay = RETRY_DELAYS[Math.min(retryCount, RETRY_DELAYS.length - 1)];
        retryCount++;
        console.log(`[Auto-Reconnect] Retrying in ${delay / 1000}s (attempt ${retryCount})...`);
        retryTimeout = setTimeout(() => {
          fetchQuote();
        }, delay);
      }

      function clearRetry() {
        if (retryTimeout) {
          clearTimeout(retryTimeout);
          retryTimeout = null;
        }
        retryCount = 0;
      }

      async function isNetworkReachable() {
        if (!navigator.onLine) return false;
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 3000);
          const res = await fetch(GITHUB_QUOTES_URL, {
            method: 'HEAD',
            cache: 'no-store',
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          return res.ok;
        } catch (e) {
          return navigator.onLine;
        }
      }

      function applyGenre(newGenre) {
        if (!newGenre) return;
        currentMode = newGenre;
        modeSelect.value = newGenre;
        clearRetry();

        // 1. INSTANT ZERO-LATENCY FEEDBACK: Display an authentic quote from the selected genre immediately!
        const instantQuote = pickQuoteFromDatabase(currentMode);
        updateQuoteDisplay(instantQuote, isOnlineState, instantQuote.genres);

        // 2. Refresh cycle in background
        resetIntervalClock();
      }

      async function fetchQuote(isManual = false) {
        if (isFetching && !isManual) return;
        isFetching = true;
        const fetchId = ++currentFetchId;

        statusDotEl.className = 'status-dot loading';
        refreshBtn.classList.add('spinning');

        let fetchedData = null;
        let detectedGenres = [];
        let isOnline = false;

        // In 'all' mode, occasionally (~20%) poll Animechan API for fresh live quotes if connected,
        // or prioritize our rich 801+ multi-genre database containing all requested types and AniQuotes.
        const shouldQueryLiveApi = navigator.onLine && (Math.random() < 0.20 || isManual);

        if (shouldQueryLiveApi) {
          const endpoints = API_ENDPOINTS.random;
          for (const url of endpoints) {
            try {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 2500);

              const res = await fetch(url, {
                headers: { 'Accept': 'application/json' },
                signal: controller.signal
              });
              clearTimeout(timeoutId);

              if (res.ok) {
                const json = await res.json();
                const parsed = parseQuotePayload(json);
                if (parsed && parsed.quote) {
                  const genres = await getAnimeGenres(parsed.anime);
                  if (matchesGenre(genres, currentMode)) {
                    isOnline = true;
                    fetchedData = parsed;
                    detectedGenres = genres;
                    break;
                  }
                }
              }
            } catch (err) {
              console.warn(`[Animechan] Fetch from ${url} failed:`, err.message);
            }
          }
        }

        // Check if user changed genre while this request was running
        if (fetchId !== currentFetchId) {
          isFetching = false;
          refreshBtn.classList.remove('spinning');
          return;
        }

        // Master Database Fallback / Primary Source:
        // Guarantees all 801 quotes from AniQuotesAPI + all genre types (Ecchi, Romance, Comedy, Psych, Fantasy, Action)
        if (!fetchedData) {
          const localQuote = pickQuoteFromDatabase(currentMode);
          fetchedData = localQuote;
          detectedGenres = localQuote.genres;
          isOnline = navigator.onLine;
        }

        if (!navigator.onLine) {
          isOnline = false;
        }

        isOnlineState = isOnline;
        updateQuoteDisplay(fetchedData, isOnline, detectedGenres);
        refreshBtn.classList.remove('spinning');
        isFetching = false;

        if (isOnline) {
          clearRetry();
          resetIntervalClock();
        } else {
          scheduleRetry();
        }
      }

      function resetIntervalClock() {
        timeElapsed = 0;
        progressBar.style.width = '0%';

        if (rotationTimer) clearInterval(rotationTimer);
        if (progressTimer) clearInterval(progressTimer);

        progressTimer = setInterval(() => {
          timeElapsed += PROGRESS_TICK_MS;
          const percentage = Math.min((timeElapsed / ROTATION_INTERVAL_MS) * 100, 100);
          progressBar.style.width = `${percentage}%`;
        }, PROGRESS_TICK_MS);

        rotationTimer = setInterval(() => {
          fetchQuote();
        }, ROTATION_INTERVAL_MS);
      }

      function setupDraggable() {
        let isDragging = false;
        let startX, startY, origX, origY;

        const savedPos = localStorage.getItem('animechan_widget_pos');
        if (savedPos) {
          try {
            const { x, y } = JSON.parse(savedPos);
            quoteCard.style.left = `${x}px`;
            quoteCard.style.top = `${y}px`;
            quoteCard.style.right = 'auto';
            quoteCard.style.bottom = 'auto';
          } catch (e) { }
        }

        quoteCard.addEventListener('mousedown', (e) => {
          if (e.target.closest('button') || e.target.closest('select') || e.target.closest('input')) return;

          isDragging = true;
          startX = e.clientX;
          startY = e.clientY;

          const rect = quoteCard.getBoundingClientRect();
          origX = rect.left;
          origY = rect.top;

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });

        function onMouseMove(e) {
          if (!isDragging) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;

          let newX = Math.max(10, Math.min(window.innerWidth - quoteCard.offsetWidth - 10, origX + dx));
          let newY = Math.max(10, Math.min(window.innerHeight - quoteCard.offsetHeight - 10, origY + dy));

          quoteCard.style.left = `${newX}px`;
          quoteCard.style.top = `${newY}px`;
          quoteCard.style.right = 'auto';
          quoteCard.style.bottom = 'auto';
        }

        function onMouseUp() {
          if (!isDragging) return;
          isDragging = false;
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);

          const rect = quoteCard.getBoundingClientRect();
          localStorage.setItem('animechan_widget_pos', JSON.stringify({ x: rect.left, y: rect.top }));
        }
      }

      refreshBtn.addEventListener('click', () => {
        clearRetry();
        fetchQuote(true);
      });

      // Robust dropdown event binding with stopPropagation to prevent drag capture
      modeSelect.addEventListener('change', (e) => {
        applyGenre(e.target.value);
      });
      modeSelect.addEventListener('input', (e) => {
        applyGenre(e.target.value);
      });
      modeSelect.addEventListener('mousedown', (e) => {
        e.stopPropagation();
      });
      modeSelect.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
      });

      // Quick manual reconnect / refresh by clicking status badge
      const statusBadge = document.querySelector('.status-badge');
      if (statusBadge) {
        statusBadge.addEventListener('click', () => {
          clearRetry();
          fetchQuote(true);
        });
      }

      // Automatically keep online whenever laptop connects to internet
      window.addEventListener('online', () => {
        console.log('[Network] Internet connected! Fetching live quote...');
        clearRetry();
        fetchQuote(true);
      });

      // Immediately show offline state when internet disconnects
      window.addEventListener('offline', () => {
        console.log('[Network] Internet disconnected.');
        statusDotEl.className = 'status-dot offline';
        statusDotEl.title = `${statusLabelEl.textContent.trim()} (Offline • Waiting for connection...)`;
        scheduleRetry();
      });

      // Automatically reconnect when laptop resumes from sleep or screen unlock
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden && !isFetching) {
          if (statusDotEl.classList.contains('offline')) {
            clearRetry();
            fetchQuote(true);
          }
        }
      });

      window.addEventListener('focus', () => {
        if (statusDotEl.classList.contains('offline') && !isFetching) {
          clearRetry();
          fetchQuote(true);
        }
      });

      // Lively Wallpaper Customize Menu Integration
      window.livelyPropertyListener = (name, val) => {
        if (name === 'quoteMode') {
          const modeMap = ['all', 'action', 'ecchi', 'romance', 'comedy', 'psychological', 'fantasy'];
          const selected = modeMap[val] || 'all';
          applyGenre(selected);
        } else if (name === 'cardOpacity') {
          quoteCard.style.background = `rgba(13, 13, 17, ${val / 100})`;
        } else if (name === 'accentColor') {
          document.documentElement.style.setProperty('--accent-color', val);
        } else if (name === 'videoOpacity') {
          bgVideo.style.opacity = (val / 100);
        }
      };

      // Initialize
      setupDraggable();
      loadSavedVideo();
      fetchQuote();
    })();
  </script>
</body>
